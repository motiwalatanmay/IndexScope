name: Test FII fetch from runner (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Cut a copy of fii.json back to 2026-07-31 and run the incremental fetch
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/fii.json"))
          print({k: (type(v).__name__) for k, v in d.items()})
          rows = d["rows"] if "rows" in d else d["data"]
          print("rows before:", len(rows), "last:", rows[-1])
          PY
          cp data/fii.json /tmp/fii_copy.json
          python scripts/fetch_fii.py --data /tmp/fii_copy.json; echo "FETCH_RC=$?"
          curl -sS -o /dev/null -w "nsdl_http=%{http_code}\n" -A "Mozilla/5.0" "https://www.fpi.nsdl.co.in/web/Reports/Archive.aspx" || true
