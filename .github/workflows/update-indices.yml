name: Update index data

on:
  schedule:
    # 9:00 AM IST = 03:30 UTC, 7:00 PM IST = 13:30 UTC
    - cron: "30 3 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-indices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests yfinance

      - name: Fetch NSE /api/allIndices and upsert data/*.json
        run: python scripts/fetch_indices.py

      - name: Fetch global index history (yfinance) -> data/global.json
        # Non-fatal: a Yahoo hiccup must not block the India refresh. The
        # frontend keeps the last committed global.json if this is skipped.
        continue-on-error: true
        run: python scripts/fetch_global.py

      - name: Fetch global valuation (trailing P/E + CAPE) -> data/global_val.json
        continue-on-error: true
        run: python scripts/fetch_global_val.py

      - name: Fetch macro series (USD/INR, Brent futures, Nifty) -> data/macro.json
        # Non-fatal: fetch_macro.py refuses to write on thin or stale data, so a Yahoo gap
        # leaves the last committed file. The page reads asOf from the file and prints its age.
        continue-on-error: true
        run: python scripts/fetch_macro.py

      # FII flows: NOT fetched here. NSDL/NSE are not reliable from runner IPs. Jerry's Mac job
      # (system/bin/indexscope_fii_push.py) runs scripts/fetch_fii.py and pushes fii.json only.

      # Buffett indicator: NOT fetched here. BSE's MarketCapital API returns 403 to
      # GitHub runner IPs and to Cloudflare egress (2026-10-06), which froze
      # data/buffett.json at 2026-09-23 behind continue-on-error. Jerry's Mac job
      # com.jerry.indexscopebuffett (system/bin/indexscope_buffett_push.py) runs
      # scripts/fetch_buffett.py from a residential IP and pushes buffett.json only.

      - name: Refresh India 10Y G-Sec series (EY-BY panel)
        # Non-fatal: frontend has an embedded fallback series.
        continue-on-error: true
        run: python scripts/fetch_gsec.py

      - name: Evaluate user alerts and email on crossings
        # Non-fatal: a worker/Resend hiccup must not block the data refresh.
        # Reads users' alerts from the worker, emails crossings via Resend,
        # and updates data/alert_state.json (committed below).
        continue-on-error: true
        env:
          WORKER_BASE: ${{ secrets.WORKER_BASE }}
          ADMIN_KEY: ${{ secrets.ALERTS_ADMIN_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python scripts/eval_alerts.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh NSE indices ($(date -u +%Y-%m-%dT%H:%MZ))"
            # The Mac jobs may have pushed meanwhile; they only write buffett.json and fii.json.
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep $((i*5)); done
          fi
